name: Deploy NexaMOS Identity API to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Auto Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '103.190.0.23' }}
          port: ${{ secrets.VPS_PORT || 4775 }}
          username: ${{ secrets.VPS_USER || 'dsmdsm' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            echo "🚀 [Deploy] Memulai auto-deploy nexamos-identity-api..."
            cd ~/nexamos-identity-api
            echo "📥 [Git] Menarik pembaruan kode terbaru dari branch main..."
            git pull origin main
            
            echo "📝 [Config] Menyiapkan konfigurasi produksi .env..."
            cat << 'EOF' > .env
            IAM_DB_HOST=srv1412.hstgr.io
            IAM_DB_PORT=3306
            IAM_DB_USER=u294320793_adminmain
            IAM_DB_PASSWORD=Wishnunexa2026!
            IAM_DB_NAME=u294320793_nexamain
            PORT=4000
            NODE_ENV=production
            KEYCLOAK_BASE_URL=https://nexamos.cloud/identity
            KEYCLOAK_REALM=nexamos
            KEYCLOAK_JWKS_URI=https://nexamos.cloud/identity/realms/nexamos/protocol/openid-connect/certs
            KEYCLOAK_ISSUER=https://nexamos.cloud/identity/realms/nexamos
            CORS_ORIGINS=https://crm.nexamos.cloud,https://studio.nexamos.cloud,https://workspace.nexamos.cloud,https://superadmin.nexamos.cloud,https://nexamos.cloud
            RATE_LIMIT_WINDOW_MS=900000
            RATE_LIMIT_MAX=100
            EOF
            sed -i 's/^[ \t]*//' .env

            echo "📦 [Dependencies] Menginstal dependensi produksi..."
            npm install --production --prefer-offline --no-audit

            if [ -d /var/www/nexamos-identity-api ]; then
              echo "🔄 [Sync] Menyelaraskan /var/www/nexamos-identity-api..."
              cp -rf ~/nexamos-identity-api/* /var/www/nexamos-identity-api/ 2>/dev/null || true
              cp -f ~/nexamos-identity-api/.env /var/www/nexamos-identity-api/.env 2>/dev/null || true
            fi

            echo "🔄 [PM2] Me-restart fresh service nexamos-identity-api dari ~/nexamos-identity-api..."
            pm2 delete nexamos-identity-api 2>/dev/null || true
            pm2 start src/app.js --name nexamos-identity-api
            pm2 save
            echo "✅ [Sukses] Deployment nexamos-identity-api berhasil dan aktif!"
