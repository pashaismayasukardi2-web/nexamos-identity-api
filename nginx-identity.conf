# ═══════════════════════════════════════════════════════════════
# nginx config — identity.nexamos.cloud
# Reverse proxy ke Keycloak (port 8180) + Identity API (port 4000)
#
# Simpan di VPS: /etc/nginx/sites-available/identity.nexamos.cloud
# Lalu: ln -s /etc/nginx/sites-available/identity.nexamos.cloud \
#              /etc/nginx/sites-enabled/
# ═══════════════════════════════════════════════════════════════

# ── Keycloak (OIDC Provider) ──────────────────────────────────
server {
    listen 80;
    server_name identity.nexamos.cloud;

    # Certbot akan otomatis handle HTTPS redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name identity.nexamos.cloud;

    # SSL — diisi otomatis oleh certbot
    ssl_certificate     /etc/letsencrypt/live/identity.nexamos.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/identity.nexamos.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # ── /realms/, /resources/, /js/ → Keycloak (port 8180)
    location ~* ^/(realms|resources|js|welcome)/ {
        proxy_pass         http://127.0.0.1:8180;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_buffer_size  128k;
        proxy_buffers      4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Keycloak admin console (proteksi dengan IP whitelist jika perlu)
    location /admin/ {
        proxy_pass         http://127.0.0.1:8180;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        # Uncomment untuk batasi akses admin ke IP tertentu:
        # allow 103.xxx.xxx.xxx;  # IP kantor
        # deny all;
    }

    # ── /api/v1/ → NexaMOS Identity API (port 4000)
    location /api/v1/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:4000/health;
    }
}

# ═══════════════════════════════════════════════════════════════
# nginx config — workspace.nexamos.cloud
# NexaMOS Unified Workspace (Next.js — port 3002)
# ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name workspace.nexamos.cloud;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name workspace.nexamos.cloud;

    ssl_certificate     /etc/letsencrypt/live/workspace.nexamos.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workspace.nexamos.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    location / {
        proxy_pass         http://127.0.0.1:3002;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}

